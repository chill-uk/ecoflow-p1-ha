name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r '.version' custom_components/ecoflow_p1/manifest.json)

          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag and manifest versions do not match."
            exit 1
          fi

      - name: Create integration ZIP
        run: |
          cd custom_components/ecoflow_p1
          zip -r "$GITHUB_WORKSPACE/ecoflow_p1.zip" .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release already exists, uploading asset..."
            gh release upload "${GITHUB_REF_NAME}" \
              ecoflow_p1.zip \
              --clobber
          else
            echo "Creating release..."

            RELEASE_FLAGS=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi

            gh release create "${GITHUB_REF_NAME}" \
              ecoflow_p1.zip \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
